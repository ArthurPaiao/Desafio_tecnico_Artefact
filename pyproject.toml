[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-agent"
version = "0.1.0"
description = "Customer service agent for Empório da Música (technical case)"
requires-python = ">=3.10"
dependencies = [
    "tzdata; sys_platform == 'win32'",   # Windows has no system time zone database
]   # nothing else: the default (Gemini) path uses only the standard library

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["emporio"]   # the repo root also holds data/, tests/ and scripts/, which are not packages
